<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Cricket Darts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .mark-0::after { content: "-"; color: #475569; }
        .mark-1::after { content: "/"; }
        .mark-2::after { content: "X"; }
        .mark-3::after { content: "Ⓧ"; color: #22c55e; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- HOME SCREEN -->
    <div id="home-screen" class="max-w-md mx-auto mt-12 md:mt-24 p-6 md:p-8 bg-gray-800 rounded-xl shadow-lg border border-gray-700 text-center">
        <h1 class="text-4xl font-bold text-blue-400 mb-2">Custom Cricket</h1>
        <p class="text-gray-400 mb-8">Select your players to begin</p>

        <div class="mb-6 text-left">
            <label class="block text-gray-300 mb-2 font-bold text-sm uppercase tracking-wide">Player 1 (Blue)</label>
            <select id="p1-select" class="w-full p-4 bg-gray-700 text-white rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400 text-xl font-bold appearance-none">
                <option value="Alvin">Alvin</option>
                <option value="Tim">Tim</option>
                <option value="Onats">Onats</option>
                <option value="Ron">Ron</option>
                <option value="Royce">Royce</option>
                <option value="Tolits">Tolits</option>
            </select>
        </div>

        <div class="mb-10 text-left">
            <label class="block text-gray-300 mb-2 font-bold text-sm uppercase tracking-wide">Player 2 (Red)</label>
            <select id="p2-select" class="w-full p-4 bg-gray-700 text-white rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-400 text-xl font-bold appearance-none">
                <option value="Tim" selected>Tim</option> <!-- Default to Tim so it's different -->
                <option value="Alvin">Alvin</option>
                <option value="Onats">Onats</option>
                <option value="Ron">Ron</option>
                <option value="Royce">Royce</option>
                <option value="Tolits">Tolits</option>
            </select>
        </div>

        <button onclick="startGame()" class="w-full py-4 bg-green-600 hover:bg-green-500 text-white rounded-lg font-bold text-xl shadow-lg transition transform hover:scale-105">
            Start Match
        </button>
    </div>

    <!-- GAME SCREEN (Hidden by default) -->
    <div id="game-screen" class="max-w-6xl mx-auto p-4 md:p-8 hidden">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400">Custom Cricket</h1>
            <button onclick="endGame()" class="px-4 py-2 bg-red-900 hover:bg-red-700 text-red-100 rounded-lg text-sm font-bold transition shadow-md">
                End Game
            </button>
        </div>

        <!-- Layout Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <!-- Scoreboard Section (Left Side) -->
            <div class="lg:col-span-5 bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-700">
                <div class="grid grid-cols-3 bg-gray-900 text-center p-4 border-b border-gray-700">
                    <div>
                        <h2 id="p1-name" class="text-xl font-bold text-blue-400">Player 1</h2>
                        <p class="text-4xl font-mono mt-2" id="p1-score">0</p>
                    </div>
                    <div class="flex items-center justify-center">
                        <span class="text-gray-400 uppercase tracking-widest text-sm">Targets</span>
                    </div>
                    <div>
                        <h2 id="p2-name" class="text-xl font-bold text-red-400">Player 2</h2>
                        <p class="text-4xl font-mono mt-2" id="p2-score">0</p>
                    </div>
                </div>

                <div id="scoreboard-body" class="divide-y divide-gray-700 font-mono text-2xl">
                    <!-- Rows injected by JS -->
                </div>
            </div>

            <!-- Control Panel Section (Right Side) -->
            <div class="lg:col-span-7 bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg lg:sticky lg:top-8">
                <div class="flex justify-between items-center mb-8">
                    <div class="flex gap-4">
                        <button onclick="setPlayer(1)" id="btn-p1" class="px-6 py-3 rounded-lg bg-blue-600 text-white font-bold ring-2 ring-blue-400 ring-offset-2 ring-offset-gray-800 text-lg">Player 1</button>
                        <button onclick="setPlayer(2)" id="btn-p2" class="px-6 py-3 rounded-lg bg-gray-700 text-gray-300 font-bold hover:bg-red-900 transition text-lg">Player 2</button>
                    </div>
                    <button onclick="undoHit()" id="btn-undo" class="px-5 py-3 bg-gray-600 hover:bg-gray-500 text-white rounded-lg font-bold disabled:opacity-50 disabled:cursor-not-allowed flex gap-2 items-center shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
                        Undo
                    </button>
                </div>

                <div class="grid grid-cols-5 gap-3 mb-8" id="target-buttons">
                    <!-- Target buttons injected by JS -->
                </div>

                <div class="grid grid-cols-3 gap-4" id="hit-buttons">
                    <!-- Hit modifiers injected by JS -->
                </div>
            </div>

        </div> <!-- End of Grid -->
    </div>

    <script>
        // --- Core Scoring Logic ---
        class CustomCricketScoring {
            constructor(p1Name, p2Name) {
                this.validTargets = [20, 19, 18, 17, 16, 15, 14, 13, 12, 25];
                this.history = [];
                this.players = {
                    1: this.initPlayer(p1Name),
                    2: this.initPlayer(p2Name)
                };
            }

            initPlayer(name) {
                let state = { name: name, score: 0, marks: {} };
                this.validTargets.forEach(target => state.marks[target] = 0);
                return state;
            }

            saveState() {
                this.history.push(JSON.parse(JSON.stringify(this.players)));
            }

            undoLastHit() {
                if (this.history.length > 0) {
                    this.players = this.history.pop();
                    return true;
                }
                return false;
            }

            recordHit(playerId, target, hitType) {
                const player = this.players[playerId];
                const opponent = this.players[playerId === 1 ? 2 : 1];
                const currentMarks = player.marks[target];
                
                let marksEarned = 0;
                
                if (target === 25) {
                    if (hitType === 'outer') marksEarned = 1;
                    if (hitType === 'inner') marksEarned = 2;
                } else {
                    if (hitType === 'double') marksEarned = 2;
                    if (hitType === 'triple') marksEarned = 3;
                    if (hitType === 'single') {
                        if (currentMarks > 0 && currentMarks < 3) {
                            marksEarned = 1;
                        } else {
                            marksEarned = 0; 
                        }
                    }
                }

                if (marksEarned === 0) return; 

                this.saveState();

                const marksNeededToClose = 3 - currentMarks;

                if (currentMarks < 3) {
                    player.marks[target] = Math.min(3, currentMarks + marksEarned);
                    const overflowMarks = marksEarned - marksNeededToClose;
                    
                    if (overflowMarks > 0 && opponent.marks[target] < 3) {
                        player.score += (overflowMarks * target);
                    }
                } else {
                    if (opponent.marks[target] < 3) {
                        player.score += (marksEarned * target);
                    }
                }
            }
        }

        // --- UI State & DOM Manipulation ---
        let game;
        let currentPlayer = 1;
        let selectedTarget = 20;

        // Function called when "Start Match" is clicked on the Home Screen
        function startGame() {
            const p1 = document.getElementById('p1-select').value;
            const p2 = document.getElementById('p2-select').value;

            if (p1 === p2) {
                alert("Please select two different players!");
                return;
            }

            // Initialize game with selected names
            game = new CustomCricketScoring(p1, p2);
            currentPlayer = 1;
            selectedTarget = 20;

            // Update UI text to show chosen names
            document.getElementById('p1-name').innerText = p1;
            document.getElementById('p2-name').innerText = p2;
            document.getElementById('btn-p1').innerText = p1;
            document.getElementById('btn-p2').innerText = p2;

            // Hide home screen, show game screen
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            renderScoreboard();
            renderControls();
            setPlayer(1); // Set Player 1 as active by default
        }

        // Returns to the home screen
        function endGame() {
            if(confirm("Are you sure you want to end this game and return to the home screen?")) {
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('home-screen').classList.remove('hidden');
            }
        }

        function renderScoreboard() {
            const tbody = document.getElementById('scoreboard-body');
            tbody.innerHTML = '';
            
            game.validTargets.forEach(target => {
                const p1Marks = game.players[1].marks[target];
                const p2Marks = game.players[2].marks[target];
                const targetLabel = target === 25 ? 'BULL' : target;
                
                tbody.innerHTML += `
                    <div class="grid grid-cols-3 text-center p-3 hover:bg-gray-750 transition items-center">
                        <div class="text-blue-400 font-bold mark-${p1Marks}"></div>
                        <div class="font-bold text-gray-300">${targetLabel}</div>
                        <div class="text-red-400 font-bold mark-${p2Marks}"></div>
                    </div>
                `;
            });

            document.getElementById('p1-score').innerText = game.players[1].score;
            document.getElementById('p2-score').innerText = game.players[2].score;

            const undoBtn = document.getElementById('btn-undo');
            if (game.history.length === 0) {
                undoBtn.setAttribute('disabled', 'true');
            } else {
                undoBtn.removeAttribute('disabled');
            }
        }

        function setPlayer(id) {
            currentPlayer = id;
            document.getElementById('btn-p1').className = `px-6 py-3 rounded-lg font-bold transition text-lg ${id === 1 ? 'bg-blue-600 text-white ring-2 ring-blue-400 ring-offset-2 ring-offset-gray-800 shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-blue-900'}`;
            document.getElementById('btn-p2').className = `px-6 py-3 rounded-lg font-bold transition text-lg ${id === 2 ? 'bg-red-600 text-white ring-2 ring-red-400 ring-offset-2 ring-offset-gray-800 shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-red-900'}`;
        }

        function setTarget(t) {
            selectedTarget = t;
            renderControls();
        }

        function logHit(hitType) {
            game.recordHit(currentPlayer, selectedTarget, hitType);
            renderScoreboard();
        }

        function undoHit() {
            if (game.undoLastHit()) {
                renderScoreboard();
            }
        }

        function renderControls() {
            const targetContainer = document.getElementById('target-buttons');
            targetContainer.innerHTML = '';
            game.validTargets.forEach(t => {
                const label = t === 25 ? 'BULL' : t;
                const activeClasses = t === selectedTarget ? 'bg-gray-100 text-gray-900 font-bold shadow-lg scale-105' : 'bg-gray-700 text-gray-300 hover:bg-gray-600';
                targetContainer.innerHTML += `<button onclick="setTarget(${t})" class="py-4 text-xl rounded-lg transition-transform ${activeClasses}">${label}</button>`;
            });

            const hitContainer = document.getElementById('hit-buttons');
            if (selectedTarget === 25) {
                hitContainer.innerHTML = `
                    <button onclick="logHit('outer')" class="col-span-3 lg:col-span-1 py-6 text-xl bg-green-700 hover:bg-green-600 rounded-lg font-bold shadow-lg transition">Outer (1 Mk)</button>
                    <button onclick="logHit('inner')" class="col-span-3 lg:col-span-2 py-6 text-xl bg-red-700 hover:bg-red-600 rounded-lg font-bold shadow-lg transition">Inner (2 Mks)</button>
                `;
            } else {
                hitContainer.innerHTML = `
                    <button onclick="logHit('single')" class="py-6 text-xl bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-bold shadow-lg transition">Single</button>
                    <button onclick="logHit('double')" class="py-6 text-xl bg-green-700 hover:bg-green-600 rounded-lg font-bold shadow-lg transition">Double</button>
                    <button onclick="logHit('triple')" class="py-6 text-xl bg-red-700 hover:bg-red-600 rounded-lg font-bold shadow-lg transition">Triple</button>
                `;
            }
        }
    </script>
</body>
</html>
